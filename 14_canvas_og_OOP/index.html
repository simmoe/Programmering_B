<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas og OOP</title>
    <link rel="icon" type="image/png" href="../api_lib/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../api_lib/favicon/favicon.svg" />
    <link rel="shortcut icon" href="../api_lib/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../api_lib/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="../api_lib/favicon/site.webmanifest" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css">
    <link rel="stylesheet" href="../api_lib/myApiStyles.css">
    <link rel="stylesheet" href="index.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.15.2/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>
</head>

<body>
    <div id="toast"></div>
    <main>
        <div class="page" id="page1">
            <div>
                <h1>Jumping cabbage</h1>
                <h2>Endnu et banger landmandsspil fra simmoe</h2>
            </div>
            <button id="startButton">Start game</button>
        </div>
        <div id="page2" class="page">
            <div id="info"></div>
        </div>
        <div id="page3" class="page">
            <h1>Game over</h1>
            <div id="stats"></div>
            <div class="scores">
                <h2>High scores</h2>
                <div id="highScore">
                </div>
                <input type="text" id="name">
                <button id="saveHighscore">Gem Highscore</button>
            </div>
            <button id="restartButton">Try again</button>
        </div>

    </main>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>
    <script src="../api_lib/firebase.js"></script>
    <script src="../api_lib/myApi.js"></script>
    <script src="../api_lib/myClasses.js"></script>
    <script src="./index.js"></script>
</body>

</html>
