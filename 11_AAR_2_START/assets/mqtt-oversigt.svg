<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">MQTT-oversigt</title>
  <desc id="desc">Publisher sender en besked til en broker på et topic. Subscriber lytter på samme topic og modtager beskeden.</desc>

  <rect width="920" height="360" fill="#f7f7f5"/>

  <!-- Publisher -->
  <rect x="40" y="110" width="200" height="140" rx="16" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="140" y="155" text-anchor="middle" font-family="Roboto, Oxygen, Arial, sans-serif" font-size="22" font-weight="600" fill="#222">Publisher</text>
  <text x="140" y="190" text-anchor="middle" font-family="Roboto, Oxygen, Arial, sans-serif" font-size="15" fill="#444">MQTT Explorer</text>
  <text x="140" y="214" text-anchor="middle" font-family="Roboto, Oxygen, Arial, sans-serif" font-size="15" fill="#444">eller M5</text>

  <!-- Arrow 1 -->
  <line x1="250" y1="180" x2="350" y2="180" stroke="#222" stroke-width="2.5"/>
  <polygon points="350,172 368,180 350,188" fill="#222"/>
  <text x="310" y="165" text-anchor="middle" font-family="Roboto, Oxygen, Arial, sans-serif" font-size="14" fill="#333">publish</text>
  <text x="310" y="205" text-anchor="middle" font-family="Roboto Mono, Menlo, monospace" font-size="13" fill="#555">"2"</text>

  <!-- Broker -->
  <rect x="380" y="90" width="220" height="180" rx="16" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="490" y="140" text-anchor="middle" font-family="Roboto, Oxygen, Arial, sans-serif" font-size="22" font-weight="600" fill="#222">Broker</text>
  <text x="490" y="175" text-anchor="middle" font-family="Roboto, Oxygen, Arial, sans-serif" font-size="15" fill="#444">mqtt.nextservices.dk</text>
  <rect x="420" y="200" width="140" height="36" rx="8" fill="#efefef" stroke="#666" stroke-width="1.5"/>
  <text x="490" y="223" text-anchor="middle" font-family="Roboto Mono, Menlo, monospace" font-size="14" fill="#222">programmering</text>
  <text x="490" y="252" text-anchor="middle" font-family="Roboto, Oxygen, Arial, sans-serif" font-size="13" fill="#666">topic</text>

  <!-- Arrow 2 -->
  <line x1="610" y1="180" x2="710" y2="180" stroke="#222" stroke-width="2.5"/>
  <polygon points="710,172 728,180 710,188" fill="#222"/>
  <text x="670" y="165" text-anchor="middle" font-family="Roboto, Oxygen, Arial, sans-serif" font-size="14" fill="#333">message</text>
  <text x="670" y="205" text-anchor="middle" font-family="Roboto Mono, Menlo, monospace" font-size="13" fill="#555">"2"</text>

  <!-- Subscriber -->
  <rect x="740" y="110" width="140" height="140" rx="16" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="810" y="160" text-anchor="middle" font-family="Roboto, Oxygen, Arial, sans-serif" font-size="20" font-weight="600" fill="#222">Subscriber</text>
  <text x="810" y="195" text-anchor="middle" font-family="Roboto, Oxygen, Arial, sans-serif" font-size="15" fill="#444">hjemmeside</text>
  <text x="810" y="220" text-anchor="middle" font-family="Roboto, Oxygen, Arial, sans-serif" font-size="14" fill="#555">shiftPage(#page2)</text>

  <!-- Bottom caption -->
  <text x="460" y="330" text-anchor="middle" font-family="Roboto, Oxygen, Arial, sans-serif" font-size="16" fill="#333">Samme topic ’ beskeden kommer frem hos alle, der lytter</text>
</svg>
